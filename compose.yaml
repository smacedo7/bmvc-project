services:
  web:
    build: .
    init: true
    command: ["sh", "-c", "alembic upgrade head && exec python realtime.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bmvc:bmvc_local@db:5432/bmvc}
      BMVC_HOST: ${BMVC_HOST:-0.0.0.0}
      BMVC_COOKIE_SECURE: ${BMVC_COOKIE_SECURE:-0}
      BMVC_DEBUG: ${BMVC_DEBUG:-0}
    ports:
      - "${BMVC_BIND_ADDRESS:-127.0.0.1}:${BMVC_WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmvc}
      POSTGRES_USER: ${POSTGRES_USER:-bmvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmvc_local}
    ports:
      - "${BMVC_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bmvc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  bmvc_postgres:
