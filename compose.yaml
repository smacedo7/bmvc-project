services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bmvc
      POSTGRES_USER: bmvc
      POSTGRES_PASSWORD: bmvc_local
    ports:
      - "5433:5432"
    volumes:
      - bmvc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmvc -d bmvc"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  bmvc_postgres:
